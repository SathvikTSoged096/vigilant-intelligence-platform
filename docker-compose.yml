services:

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gotham}
      POSTGRES_USER: ${POSTGRES_USER:-gotham}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}

    volumes:
      - pg:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-gotham} -d $${POSTGRES_DB:-gotham}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  neo4j:
    image: neo4j:5-community

    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-change-me}"

    volumes:
      - neo:/data

    ports:
      - "7474:7474"
      - "7687:7687"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:7474 >/dev/null || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      STORAGE_DIR: /app/storage

    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

    ports:
      - "8000:8000"


  frontend:
    build:
      context: ./frontend

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  pg:
  neo:
  storage: